[project]
name = "mapa-mental-api"
version = "0.1.0"
description = "API del mapa mental: login con Google, un mapa por usuario y ventana de N niveles."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "authlib>=1.9",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "joserfc>=1.7",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "cryptography>=43",
    # PostgreSQL embebido para correr los tests sin Docker; no hay wheels para 3.13+.
    "pgserver>=0.1.4; python_version < '3.13'",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
