# Entorno local del primer corte (ADR 0005). Los valores salen de .env (copiado de .env.example).
# El servicio `web` (Vite con proxy de /api) se suma en la corrida del frontend.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mapa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mapa}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      POST_LOGIN_REDIRECT: ${POST_LOGIN_REDIRECT:-/}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
    volumes:
      - ./api:/srv/api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
